name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ivicosregistry.cr.de-fra.ionos.com
  IMAGE_NAME: iv-campus/ox-frontend-plugin

jobs:
  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to IONOS Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.IONOS_TOKEN_NAME }}
          password: ${{ secrets.IONOS_TOKEN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_TIMESTAMP=${{ steps.version.outputs.ts }}
            CI_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-helm:
    name: Package Helm chart
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Set chart image tag for this release
        env:
          VERSION: ${{ needs.build-docker.outputs.version }}
        run: |
          VALUES=helm/frontend-plugin-example/values.yaml
          sed -i "/^image:/,/^[^[:space:]]/{s|^  tag:.*|  tag: \"${VERSION}\"|}" "$VALUES"

      - name: Package Helm chart
        env:
          VERSION: ${{ needs.build-docker.outputs.version }}
        run: |
          cd helm
          helm package --version "$VERSION" --app-version "$VERSION" frontend-plugin-example/
          mv "frontend-plugin-example-${VERSION}.tgz" "ivcampus-plugin-${VERSION}.tgz"
          sha256sum "ivcampus-plugin-${VERSION}.tgz" > "ivcampus-plugin-${VERSION}.tgz.sha256"
          ls -lh ivcampus-plugin-*

      - name: Upload Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: |
            helm/ivcampus-plugin-*.tgz
            helm/ivcampus-plugin-*.tgz.sha256
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-docker, package-helm]
    permissions:
      contents: write
    steps:
      - name: Download Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: helm-artifacts/

      - name: Generate release notes
        run: |
          VERSION=${{ needs.build-docker.outputs.version }}
          cat << EOF > release-notes.md
          ## ivCAMPUS OX Plugin v$VERSION

          ### Docker image

          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION
          \`\`\`

          \`\`\`
          oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION
          \`\`\`

          Installers need registry credentials for \`${{ env.REGISTRY }}\` (imagePullSecret).

          ### Helm chart

          Attached: \`ivcampus-plugin-$VERSION.tgz\` (+ \`.sha256\`).

          \`\`\`bash
          helm install ivcampus-plugin ./ivcampus-plugin-$VERSION.tgz \\
            --namespace ox-suite \\
            --set imagePullSecrets[0].name=ionos-registry-credentials
          \`\`\`

          Default image in the chart: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION\`

          ### Documentation

          - [Production Deployment Guide](docs/PRODUCTION-DEPLOYMENT-GUIDE.md)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ needs.build-docker.outputs.version }}
          body_path: release-notes.md
          files: |
            helm-artifacts/ivcampus-plugin-*.tgz
            helm-artifacts/ivcampus-plugin-*.tgz.sha256
          draft: false
          prerelease: false
